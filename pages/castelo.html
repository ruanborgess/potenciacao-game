<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Fase 4 | Castelo</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
    rel="stylesheet"
  />

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      min-height: 100vh;

      display: grid;
      place-items: center;

      background:
        linear-gradient(
          rgba(5, 5, 20, 0.8),
          rgba(10, 5, 25, 0.95)
        );

      color: white;

      font-family: "Press Start 2P", cursive;

      text-align: center;
    }

    .fase {
      padding: 40px;
    }

    h1 {
      color: #c794ff;

      font-size: clamp(
        20px,
        4vw,
        36px
      );

      line-height: 1.6;

      text-shadow:
        0 0 15px rgba(199, 148, 255, 0.6);
    }

    p {
      max-width: 700px;

      margin: 25px auto;

      font-size: 12px;

      line-height: 2;
    }

    a {
      display: inline-block;

      margin-top: 20px;

      padding: 16px 22px;

      border: 3px solid #f8d86b;

      color: white;

      text-decoration: none;

      font-size: 10px;
    }

    a:hover {
      background: rgba(199, 148, 255, 0.15);
    }

  </style>

</head>

<body>

  <main class="fase">

    <h1>FASE 4 — CASTELO</h1>

    <p>
      Você chegou ao coração do reino.
      O verdadeiro desafio das potências
      espera atrás dessas muralhas.
    </p>

    <a href="mapa.html">
      VOLTAR AO MAPA
    </a>

  </main>

</body>

</html>
